# Ensure HSWM's repository instructions are loaded completely for contributors
# who do not share the maintainer's user-level Codex configuration.
project_doc_max_bytes = 32768
project_doc_fallback_filenames = []

# Bounded ontology readout is optional: ordinary checkout work also uses local
# files and hswm-workspace, without requiring a host-specific graph service.
# Keep the complete server definition here: Codex validates a project-local MCP
# table as a complete transport rather than a field-only override on exec paths.
[mcp_servers.ontology]
url = "http://127.0.0.1:5501/mcp"
enabled = true
required = false
startup_timeout_sec = 30.0
tool_timeout_sec = 60.0
default_tools_approval_mode = "writes"
enabled_tools = ["ontology_search", "ontology_get", "ontology_neighbors", "ontology_claim_history"]

# Host-scoped Phoenix observability is optional for contributors.  The stdio
# server itself exports only these four reads; this matching client allowlist is
# defense in depth.  Its VIEWER key remains in a 0600 host secret, never here.
[mcp_servers.hswm_phoenix_ro]
command = "/home/lagyeongjun/.local/libexec/hswm-phoenix-viewer-mcp"
enabled = true
required = false
startup_timeout_sec = 30.0
tool_timeout_sec = 60.0
default_tools_approval_mode = "writes"
enabled_tools = ["describeSqlSchema", "executeSql", "getProjects", "getProject"]

# Optional local document retrieval. QMD discovers the checkout's .qmd/index.yml.
# Install/version details and refresh commands: docs/operations/HSWM_AI_NATIVE_TOOLS.md.
[mcp_servers.hswm_docs]
command = "sh"
args = ["-c", 'cd "$(git rev-parse --show-toplevel)" && exec src/hswm/development/qmd/node_modules/.bin/qmd mcp']
enabled = true
required = false
startup_timeout_sec = 15.0
tool_timeout_sec = 60.0
default_tools_approval_mode = "writes"
enabled_tools = ["query", "get", "multi_get", "status"]

# Optional, pinned semantic code navigation. The wrapper fixes this checkout as
# the project and the project config removes edit, shell, and memory tools.
[mcp_servers.hswm_code]
command = "sh"
args = ["-c", 'cd "$(git rev-parse --show-toplevel)" && exec src/hswm/development/bin/hswm-serena']
enabled = true
required = false
startup_timeout_sec = 30.0
tool_timeout_sec = 60.0
default_tools_approval_mode = "writes"
enabled_tools = ["get_symbols_overview", "find_declaration", "find_referencing_symbols", "get_diagnostics_for_file"]
