name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-tests
            python-version: "3.11"
            command: |
              uv run --locked --extra dev pytest -q tests \
                --ignore=tests/test_hswm_swm0r_ontology.py \
                --ignore=tests/test_hswm_swm0w_ontology.py \
                --ignore=tests/test_graph_standard_tooling.py \
                --ignore=tests/test_research_evidence_graph_view.py \
                --ignore=tests/test_standard_graph_view.py \
                --ignore=tests/test_trace_context.py
              uv run --project _research/graph_standards/runtime --locked --extra graph \
                pytest -q tests/test_graph_standard_tooling.py \
                tests/test_research_evidence_graph_view.py \
                tests/test_standard_graph_view.py tests/test_trace_context.py
          # SWM-0R's historical byte receipt used CPython 3.12 and OpenBLAS's
          # SkylakeX kernel.  The portable job checks every non-BLAS-derived
          # field; an AVX-512 runner additionally checks the original bytes.
          - name: swm0r-evidence-portable-replay
            python-version: "3.12"
            command: uv run --locked --extra dev pytest -q tests/test_hswm_swm0r_ontology.py -k 'not live_bundle_validates_all_bytes_and_exact_replay and not validation_output_is_json_serializable'
          - name: prom-and-research-tests
            python-version: "3.11"
            command: uv run --locked --extra dev pytest -q prom_search_hswm _research/shared_field_hypothesis
          - name: selected-efficacy-claim-snapshot
            python-version: "3.11"
            command: uv run --locked hswm-verify-efficacy --pretty
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - if: matrix.name != 'swm0r-evidence-portable-replay'
        run: ${{ matrix.command }}
      - if: matrix.name == 'swm0r-evidence-portable-replay'
        run: ${{ matrix.command }}
      - if: matrix.name == 'swm0r-evidence-portable-replay'
        name: Replay every portable SWM-0R field
        run: |
          replay_root=$(mktemp -d)
          git clone --shared --no-checkout --quiet . "$replay_root/repository"
          git -C "$replay_root/repository" sparse-checkout set src/hswm prereg
          git -C "$replay_root/repository" checkout --detach 981517840e55f999a9b5cc2adee8cb39fda24af7
          (
            cd "$replay_root/repository"
            PYTHONPATH="$replay_root/repository/src" "$GITHUB_WORKSPACE/.venv/bin/python" \
              -m hswm.experiments.swm0_protocol \
              --mode confirmatory \
              --prereg-path prereg/PREREG_SWM0R_REPRESENTATION_CONFORMANCE_2026-08-20.json \
              --prereg-sha256 7e8ee52b551a810f590a1c7d5da718f85e3f32b9755c9340b317cc2e4103074a
          ) > "$RUNNER_TEMP/swm0r-replay.json"
          jq -S 'del(.bundle_sha256, .result.result_sha256) | walk(if type == "object" then del(.state_sha256, .prediction_sha256) else . end)' \
            results/raw/swm0r_representation_conformance_2026-08-20.json \
            > "$RUNNER_TEMP/swm0r-expected-portable.json"
          jq -S 'del(.bundle_sha256, .result.result_sha256) | walk(if type == "object" then del(.state_sha256, .prediction_sha256) else . end)' \
            "$RUNNER_TEMP/swm0r-replay.json" \
            > "$RUNNER_TEMP/swm0r-actual-portable.json"
          cmp "$RUNNER_TEMP/swm0r-expected-portable.json" "$RUNNER_TEMP/swm0r-actual-portable.json"
      - if: matrix.name == 'swm0r-evidence-portable-replay'
        name: Replay original bytes when the measured CPU kernel is available
        run: |
          if grep -q -m1 -w avx512f /proc/cpuinfo; then
            OPENBLAS_CORETYPE=SkylakeX OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 \
              uv run --locked --extra dev pytest -q tests/test_hswm_swm0r_ontology.py
          else
            echo 'AVX-512 unavailable; portable field replay above is authoritative for this runner.'
          fi

  source-distribution:
    name: source-distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
      - run: uv build --sdist --out-dir dist
      - run: mkdir sdist && tar -xzf dist/*.tar.gz -C sdist --strip-components=1
      - run: uv run --locked hswm-graph-standards verify
        working-directory: sdist
      - run: >-
          uv run --locked --extra dev pytest -q
          --ignore=tests/test_research_evidence_graph_view.py
          --ignore=tests/test_standard_graph_view.py
        working-directory: sdist
      - run: >-
          uv run --project _research/graph_standards/runtime --locked --extra graph
          pytest -q tests/test_research_evidence_graph_view.py
          tests/test_standard_graph_view.py
        working-directory: sdist
      - run: uv run --locked hswm-verify-efficacy --pretty
        working-directory: sdist

  effect-runtime:
    name: effect-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the Effect-runtime Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: src/hswm/effect-runtime/package-lock.json
      - name: Install the DNRD scorer Python version
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12.13"
      - name: Verify the Node and npm runtime bytes/version
        run: |
          test "$(node --version)" = "v24.13.0"
          test "$(npm --version)" = "11.6.2"
          printf '%s  %s\n' \
            '53fb205ae78805130177e24bcb459a69a1518c8d98f8965f31d85aae7ea840fc' \
            "$(command -v node)" | sha256sum --check --strict
      - name: Verify the Python scorer executable and Unicode runtime
        run: |
          uv python install 3.12.13
          python_path="$(uv python find --managed-python --no-project --resolve-links 3.12.13)"
          test "$("${python_path}" -c 'import platform; print(platform.python_version())')" = "3.12.13"
          test "$("${python_path}" -c 'import unicodedata; print(unicodedata.unidata_version)')" = "15.0.0"
          printf '%s  %s\n' \
            '021044895e95be79dc2f110367607e684119afbc8ce75f6f0eec94844e0acec7' \
            "${python_path}" | sha256sum --check --strict
      - name: Install the locked Effect dependency graph
        working-directory: src/hswm/effect-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild and independently judge the bounded DNRD-5 source closure
        run: |
          dnrd5_snapshot_root="$(mktemp -d "${RUNNER_TEMP}/dnrd5-source-closure.XXXXXX")"
          dnrd5_snapshot="${dnrd5_snapshot_root}/repository"
          dnrd5_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          dnrd5_npm_cache="$(npm config get cache)"
          git clone --shared --no-checkout --quiet "${GITHUB_WORKSPACE}" "${dnrd5_snapshot}"
          git -C "${dnrd5_snapshot}" checkout --detach --quiet "${dnrd5_commit}"
          env \
            npm_config_cache="${dnrd5_npm_cache}" \
            npm_config_userconfig="${dnrd5_snapshot}/src/hswm/effect-runtime/.npmrc" \
            npm_config_offline=true \
            npm_config_ignore_scripts=true \
            npm_config_audit=false \
            npm_config_fund=false \
            npm_config_update_notifier=false \
            HTTP_PROXY= HTTPS_PROXY= ALL_PROXY= NO_PROXY='*' \
            http_proxy= https_proxy= all_proxy= no_proxy='*' \
            npm ci --offline --ignore-scripts --no-audit --no-fund \
            --prefix "${dnrd5_snapshot}/src/hswm/effect-runtime"
          (
            cd "${dnrd5_snapshot}"
            DNRD5_SNAPSHOT="${dnrd5_snapshot}" \
            DNRD5_COMMIT="${dnrd5_commit}" \
            DNRD5_NPM_CACHE="${dnrd5_npm_cache}" \
              uv run --project "${GITHUB_WORKSPACE}" --locked --extra dev python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import sys

          snapshot = Path(os.environ["DNRD5_SNAPSHOT"])
          from _research.dnrd5.independent_source_build_import_judge import (
              judge_source_build_import_closure,
          )
          from _research.dnrd5.source_build_import_closure import (
              capture_local_source_build_import_closure,
          )
          import _research.dnrd5.independent_source_build_import_judge as judge_module
          import _research.dnrd5.source_build_import_closure as capture_module

          for module in (capture_module, judge_module):
              module_path = Path(module.__file__).resolve()
              if not module_path.is_relative_to(snapshot):
                  raise RuntimeError(f"closure module escaped detached snapshot: {module_path}")
          package = snapshot / "src" / "hswm" / "effect-runtime"
          environment = {
              "PATH": os.environ["PATH"],
              "LANG": "C.UTF-8",
              "LC_ALL": "C.UTF-8",
              "TZ": "UTC",
              "npm_config_cache": os.environ["DNRD5_NPM_CACHE"],
              "npm_config_userconfig": str(package / ".npmrc"),
              "npm_config_offline": "true",
              "npm_config_ignore_scripts": "true",
              "npm_config_audit": "false",
              "npm_config_fund": "false",
              "npm_config_update_notifier": "false",
              "HTTP_PROXY": "",
              "HTTPS_PROXY": "",
              "ALL_PROXY": "",
              "NO_PROXY": "*",
              "http_proxy": "",
              "https_proxy": "",
              "all_proxy": "",
              "no_proxy": "*",
          }
          captured = capture_local_source_build_import_closure(
              snapshot,
              commit=os.environ["DNRD5_COMMIT"],
              require_detached_clean=True,
              environment=environment,
          )
          node = shutil.which("node", path=environment["PATH"])
          if node is None:
              raise RuntimeError("pinned Node executable is unavailable")
          result = judge_source_build_import_closure(
              captured.raw,
              repository_root=snapshot,
              node_executable=Path(node).resolve(),
              python_executable=Path(sys.executable).resolve(),
          )
          expected = (
              result.physical_repository_verified
              and result.external_toolchains_verified
              and result.python_import_graph_independently_verified
              and result.python_call_summary_independently_verified
              and not result.emitted_bytes_independently_verified
              and not result.compiler_semantics_independently_verified
              and not result.source_a_authorized
              and result.provider_or_model_calls == 0
          )
          if not expected:
              raise RuntimeError(f"DNRD-5 closure boundary drifted: {result!r}")
          sys.stdout.buffer.write(captured.raw)
          PY
          ) > "${RUNNER_TEMP}/dnrd5-local-source-build-import-closure.json"
          test -s "${RUNNER_TEMP}/dnrd5-local-source-build-import-closure.json"
      - name: Install the byte-pinned offline drand verifier
        working-directory: tools/swm0w_drand
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise the DNRD exact-bundle verifier ABI on the official offline vector
        run: |
          printf '%s  %s\n' \
            'c5f6eff0d5692efd8f2e19953a49713d17554739016f9d0f3235380aab9ea904' \
            'tools/swm0w_drand/node_modules/drand-client/build/esm/index.mjs' | \
            sha256sum --check --strict
          node _research/dnrd/verify-beacon.mjs \
            offline \
            --expected-round 1000 \
            --pulse-file tools/swm0w_drand/fixtures/quicknet-round-1000.json \
            > "${RUNNER_TEMP}/dnrd-offline-verifier-receipt.json"
          jq -e \
            '.mode == "offline" and .pulse.round == 1000 and .verification.accepted_by == "drand-client.fetchBeacon"' \
            "${RUNNER_TEMP}/dnrd-offline-verifier-receipt.json"
      - name: Typecheck, test, build, and inspect the npm artifact
        working-directory: src/hswm/effect-runtime
        run: |
          npm run check
          npm run test -- --testTimeout=15000
          npm run build
          npm run build:dnrd
          npm pack --dry-run
      - name: Rehearse the manifest-selected DNRD runtime closure
        run: uv run --locked --extra dev pytest -q tests/test_hswm_dnrd_integration.py -k current_runtime_closure

  swm0w-beacon-crypto:
    name: swm0w-beacon-crypto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
      - name: Install the evidence-pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.13.0"
      - name: Verify the pinned Node executable
        run: |
          test "$(node --version)" = "v24.13.0"
          printf '%s  %s\n' \
            '53fb205ae78805130177e24bcb459a69a1518c8d98f8965f31d85aae7ea840fc' \
            "$(command -v node)" | sha256sum --check --strict
      - name: Install the byte-pinned drand verifier without lifecycle scripts
        working-directory: tools/swm0w_drand
        run: npm ci --ignore-scripts
      - name: Require the dependency and run the cryptographic integration surface
        run: |
          uv run --locked --extra dev python -c \
            'from hswm.experiments.swm0w_beacon import verifier_dependency_available; assert verifier_dependency_available()'
          uv run --locked --extra dev pytest -q \
            tests/test_hswm_swm0w_beacon.py \
            tests/test_hswm_swm0w_protocol.py \
            tests/test_hswm_swm0w_confirmatory.py \
            tests/test_hswm_swm0w_ontology.py

  wheel-install:
    name: wheel-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
      - run: uv build --wheel --out-dir "${{ runner.temp }}/wheel-dist"
      - run: uv venv --python 3.11 "${{ runner.temp }}/wheel-venv"
      - run: uv pip install --python "${{ runner.temp }}/wheel-venv/bin/python" "${{ runner.temp }}"/wheel-dist/*.whl
      - name: Import installed surface outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          wheel_python="${{ runner.temp }}/wheel-venv/bin/python"
          "$wheel_python" -I -c 'import p1_loop_harness, p1_phantom_environment, p1_rank_invariance_diagnostic; import certified_readout, cli_provider_transport, h3_b3_manifest, hswm_artifact_layout, hswm_token_learning_contract, synth; import f5v2_judge, f5v2_operators, f5v2_topic_cache; from hswm.artifacts import layout; from hswm.evaluation.h3 import b3_manifest; from hswm.experiments.f5v2 import judge, operators, topic_cache; from hswm.infrastructure import cli_provider_transport as provider; from hswm.learning import token_learning_contract; from hswm.prototypes import synth as canonical_synth; from hswm.substrate import certified_readout as canonical_readout; assert certified_readout.ReadoutCertificateV1 is canonical_readout.ReadoutCertificateV1; assert cli_provider_transport.CLIProvider is provider.CLIProvider; assert h3_b3_manifest.ManifestBuildError is b3_manifest.ManifestBuildError; assert hswm_artifact_layout.resolve_artifact_path is layout.resolve_artifact_path; assert hswm_token_learning_contract.TokenLearningContractError is token_learning_contract.TokenLearningContractError; assert synth.Dataset is canonical_synth.Dataset; assert f5v2_operators.CPL1NumericPacket is operators.CPL1NumericPacket; assert f5v2_topic_cache.TopicBlockV1 is topic_cache.TopicBlockV1; assert f5v2_judge.JudgeContractError is judge.JudgeContractError; assert layout.REPO_ROOT is None; import scripts.validate_hswm_semantic_weight_metric_contract'
          "$wheel_python" -I -c 'import hswm_cellular_live_probe, hswm_cellular_openai, hswm_cellular_runtime, hswm_cellular_store; from hswm.cells import live_probe, openai, runtime, store; assert hswm_cellular_runtime.KernelState is runtime.KernelState; assert hswm_cellular_store.SqliteCellRuntime is store.SqliteCellRuntime; assert hswm_cellular_openai.OpenAICompatibleCellPort is openai.OpenAICompatibleCellPort; assert hswm_cellular_openai.urlrequest is openai.urlrequest; assert hswm_cellular_live_probe.run_probe is live_probe.run_probe'
          "$wheel_python" -I -c 'import hashlib; from pathlib import Path; import hypergraph; from hswm.substrate import hypergraph as canonical; assert hypergraph is canonical; assert hypergraph.Hypergraph is canonical.Hypergraph; assert hashlib.sha256(Path(hypergraph.__file__).read_bytes()).hexdigest() == "3b72f7948196a4c865d5e35e78a2ac1ff9447b205bb07096fe9472a6462e8c34"'
          "$wheel_python" -I -c 'import hashlib; from pathlib import Path; import field_snapshot; from hswm.substrate import field_snapshot as canonical; assert field_snapshot is canonical; assert field_snapshot.FieldSnapshotV1 is canonical.FieldSnapshotV1; assert hashlib.sha256(Path(field_snapshot.__file__).read_bytes()).hexdigest() == "17cd7251d6d0ff066b70dff89945cc46dac468040ceae0b9483f8b3e015b72f2"'
          "$wheel_python" -I -c 'import hashlib; from pathlib import Path; import doc_builder, world_builder; from hswm.substrate import doc_builder as canonical_doc, world_builder as canonical_world; assert doc_builder is canonical_doc; assert world_builder is canonical_world; assert doc_builder.BuiltDoc is canonical_doc.BuiltDoc; assert world_builder.BuiltWorld is canonical_world.BuiltWorld; assert world_builder.hash_embed is doc_builder.hash_embed; assert hashlib.sha256(Path(doc_builder.__file__).read_bytes()).hexdigest() == "52c5ccee2487f62f6b6021ed6438477b7cdac8e84ffadd5f7fe031303adc79fc"; assert hashlib.sha256(Path(world_builder.__file__).read_bytes()).hexdigest() == "a1082dbc4609df819f6395188897b6849d8d40854c993b9fb93882bb0f8fc40f"'
          "$wheel_python" -I -c 'from prom_search_hswm.hswm_hypergraph import load_badiou_findings; from scripts import verify_efficacy_claims as efficacy; assert len(load_badiou_findings()) == 24; assert efficacy.DEFAULT_ROOT is None'
          "$wheel_python" -I -m traversal_cert teeth
          "$wheel_python" -I -m hswm_cellular_live_probe --mode fixture > "${{ runner.temp }}/wheel-cellular-probe.json"
          "${{ runner.temp }}/wheel-venv/bin/hswm-p1-gate-diagnostic" --help
          "${{ runner.temp }}/wheel-venv/bin/hswm-graph-standards" --repository-root "${GITHUB_WORKSPACE}" verify
          "${{ runner.temp }}/wheel-venv/bin/hswm-verify-efficacy" --root "${{ github.workspace }}" --pretty > "${{ runner.temp }}/wheel-efficacy.json"
