name = "HSWMStatisticalLearning"
defaultTargets = ["HSWMStatisticalLearning"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.1"

[[lean_lib]]
name = "HSWMStatisticalLearning"
