[tool.setuptools.package-data]
prom_search_hswm = ["data/README.md", "data/gold_badiou24.json"]

[tool.setuptools.package-dir]
hswm = "src/hswm"
certified_cut_compare = "src/certified_cut_compare"
certified_readout = "src/certified_readout"
cli_provider_transport = "src/cli_provider_transport"
diagnose = "src/diagnose"
