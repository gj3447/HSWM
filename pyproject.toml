[project]
name = "hswm"
version = "0.1.0"
description = "Research substrate for a plastic hypergraph semantic-weight field whose local functions are executed by LLMs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.0"]
kg = ["neo4j>=5.20"]

[project.scripts]
hswm-p1-gate-diagnostic = "hswm.diagnostics.p1_gate:main"
hswm-verify-efficacy = "scripts.verify_efficacy_claims:main"
hswm-legacy-replay = "hswm.infrastructure.legacy_replay:main"

[project.urls]
Homepage = "https://github.com/gj3447/HSWM"
Repository = "https://github.com/gj3447/HSWM.git"
Issues = "https://github.com/gj3447/HSWM/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# scripts/ is an implicit namespace package used by the checked-in contract
# validators and must be present in both wheels and source distributions.
packages = [
  "scripts",
  "prom_search_hswm",
  "hswm",
  "hswm.artifacts",
  "hswm.cells",
  "hswm.diagnostics",
  "hswm.evaluation",
  "hswm.evaluation.h3",
  "hswm.experiments",
  "hswm.experiments.f5v2",
  "hswm.infrastructure",
  "hswm.learning",
  "hswm.learning.p1",
  "hswm.learning.p1v2",
  "hswm.prototypes",
  "hswm.substrate",
  "certified_cut_compare",
  "certified_readout",
  "cli_provider_transport",
  "diagnose",
  "field_snapshot",
  "falsifier",
  "f5v2_operators",
  "f5v2_topic_cache",
  "f5v2_judge",
  "h3_b3_manifest",
  "h3_title_anchor_falsifier",
  "hypergraph",
  "hswm_artifact_layout",
  "hswm_cellular_live_probe",
  "hswm_cellular_openai",
  "hswm_cellular_runtime",
  "hswm_cellular_store",
  "hswm_token_learning_contract",
  "learned",
  "learned_v2",
  "learned_v3_additive",
  "legacy_adapter",
  "llm_judgment_loop",
  "neo4j_loader",
  "p1_rank_invariance_diagnostic",
  "p1v2_l0_diagnose",
  "p1v2_l0_refreeze",
  "real_run",
  "stats_protocol",
  "supersede_ledger",
  "synth",
  "synth_longdoc",
]
py-modules = [
  "weight_field",
  "readouts",
  "metrics",
  "doc_builder",
  "world_builder",
  "world_ir",
  "world_compiler",
  "traversal",
  "traversal_cert",
  "stale_poisoning",
  "ab_p5_full",
  "recorded_llm_extractor",
  "h3_fresh_manifest",
  "title_anchor_builder",
  "relation_eval",
  "composition",
  "claim_builder",
  "typed_composition",
  "h3_b3_prepare",
  "bge_m3_embed",
  "model_deployment_receipt",
  "h3_b3_falsifier",
  "h3_b3_preflight",
  "h3_arc_adjudicator",
  "h3_artifact_lifecycle",
  "qkv_routing",
  "qkv_routing_falsifier",
  "qkv_b1_probe",
  "qkv_b1_development_falsifier",
  "semantic_layer_routing",
  "semantic_layer_falsifier",
  "semantic_2wiki_oracle",
  "hswm_semantic_weight_metric",
  "hswm_weight_snapshot",
  "hswm_weight_store",
  "p1_eligibility_tag",
  "p1_weighted_walk",
  "p1_m_commit",
  "p1_loop_harness",
  "p1_llm_answerer",
  "p1_phantom_environment",
  "r1_predicate_alias",
