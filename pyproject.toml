real_run = "src/real_run"
stats_protocol = "src/stats_protocol"
supersede_ledger = "src/supersede_ledger"
synth = "src/synth"
synth_longdoc = "src/synth_longdoc"

[tool.pytest.ini_options]
testpaths = ["tests", "prom_search_hswm", "_research/shared_field_hypothesis"]
python_files = "test_*.py"
pythonpath = ["src", "."]
